<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans, "DM Sans", sans-serif);
    background: var(--surface-app);
    color: var(--ink);
    letter-spacing: -0.02em;
    -webkit-font-smoothing: antialiased;
  }
  #root { min-height: 100vh; }
  ::selection { background: var(--tint-lavender-200); }
  image-slot { --is-bg: var(--gray-150); }
  @keyframes ccPop { from { opacity: 0; transform: translateY(-6px) scale(0.98); } to { opacity: 1; transform: none; } }
  /* Pulso — animação oficial dos cards ativos no momento */
  @keyframes solPulseRing {
    0%   { box-shadow: 0 0 0 0 rgba(57,151,0,0.40); }
    70%  { box-shadow: 0 0 0 9px rgba(57,151,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(57,151,0,0); }
  }
  @keyframes solPulseGlow {
    0%,100% { box-shadow: var(--shadow-card); }
    50%     { box-shadow: 0 0 0 3px rgba(57,151,0,0.12), var(--shadow-card); }
  }
  @media (prefers-reduced-motion: reduce) {
    [data-pulse] { animation: none !important; }
    [data-jump] { animation: none !important; }
  }
  /* Pulo do card ao marcar no checklist */
  @keyframes solJump {
    0%   { transform: translateY(0) scale(1); }
    28%  { transform: translateY(-9px) scale(1.025); }
    52%  { transform: translateY(0) scale(0.997); }
    72%  { transform: translateY(-3px) scale(1.004); }
    100% { transform: translateY(0) scale(1); }
  }
</style>
</head>
